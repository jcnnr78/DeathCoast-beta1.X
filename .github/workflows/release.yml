# Build a DRAFT release (tag v<version>) with mpc-vst-plugins' shared workflow: Actions -> "Release (draft)" -> Run
# workflow. Then install that draft's zip on a device, smoke-test it and publish the draft (mpc-vst-plugins
# docs/RELEASING.md). dry_run builds the zip and skin previews as run artifacts only.
# The tools come from saustin2010/mpc-vst-plugins (sd88me's repo plus changes offered to it) until they're merged there:
# then point uses: and tools_ref at sd88me/mpc-vst-plugins and drop tools_repo.
# NorthWest (formerly WaveTablor) is a fork of Tablor (BSD-3-Clause), see README.md and NOTICE.
name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: saustin2010/mpc-vst-plugins/.github/workflows/vst-release.yml@e3a0af4e8cb7eacd4bfcc2fbcbcde834aef50fa4
    permissions:
      contents: write
    with:
      tag: v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_repo: saustin2010/mpc-vst-plugins
      tools_ref: e3a0af4e8cb7eacd4bfcc2fbcbcde834aef50fa4
      vst_dir: .
      # its library into library/, shipped as the plugin folder's tablor/ (MODULE_SUBDIR)
      build: python3 release/fetch-library.py library && mkdir -p library/presets && cp presets/wavetablor.tbl library/presets/ && mkdir -p library/wavetables && cp -R wavetables/. library/wavetables/ && bash "$MPC_VST/tools/build_port.sh" vst.json
      host_test: 'rm -rf build/northwest && cp -R library build/northwest && "$MPC_VST/tools/test_port.sh" vst.json'
      extra: library:northwest
      user_data: northwest/wavetables
      plugin_id: northwest
      license: BSD-3-Clause
      about: "Four monophonic machines in layers, each running its own model (wavetable, FM; west coast and analog coming); after Tablor."
      dry_run: ${{ inputs.dry_run }}
